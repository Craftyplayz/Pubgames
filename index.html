<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pubgames</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=IBM+Plex+Mono:wght@500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="brand">
      <span class="brand-name">Pubgames</span>
      <span class="brand-sub">Pick a game. Kelly Pool has a live tracker.</span>
    </div>
    <nav class="picker" aria-label="Choose a game">
      <div class="cats" id="cats" aria-label="Game type"></div>
      <div class="chips" id="chips"></div>
    </nav>
  </div>
</header>
<main>
  <div class="wrap page" id="game"></div>
</main>
<script src="app.js"></script>
</body>
</html>
