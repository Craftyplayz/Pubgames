<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pubgames</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="styles.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="ph-hero">
  <div class="wrap">
    <div class="ph-brand">
      <span class="ph-site">Pubgames</span>
      <span class="ph-tagline">Pick a game. Kelly Pool has a live tracker.</span>
    </div>
    <nav class="ph-picker" aria-label="Choose a game">
      <div class="stabs" id="cats" aria-label="Game type"></div>
      <div class="stabs" id="chips" aria-label="Games"></div>
    </nav>
  </div>
</header>
<main>
  <div class="wrap ph-page" id="game"></div>
</main>
</body>
</html>
